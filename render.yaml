# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Secrets are marked sync: false, so Render asks you to type them; they are never stored in git.
services:
  - type: web
    name: vowlet
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # The database is a SQLite file on the free tier's ephemeral disk. It is created and migrated on every
    # start, and instrumentation.ts seeds the demo into an empty one, so a restart or redeploy never leaves a blank app.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /
    envVars:
      # Match .node-version, which is what everyone develops and tests on locally.
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        value: file:./data.db
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_VENDOR_EMAILS
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Bryntum Gantt Enterprise license (trial) key. Baked into the page at build time, like the PayPal client id.
      - key: NEXT_PUBLIC_BRYNTUM_LICENSE_KEY
        sync: false
      # Judges share one database: a demo left changed and idle this long is reset on the next visit.
      - key: DEMO_AUTO_RESET_MINUTES
        value: "30"
      # Sign-in (Auth.js). Render generates AUTH_SECRET once and keeps it, so sessions survive redeploys.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://vowlet.onrender.com
      # Google sign-in is optional; without these two only email + password is offered.
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
